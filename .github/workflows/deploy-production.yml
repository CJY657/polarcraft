name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check backend types
        run: pnpm typecheck:api

      - name: Build production artifacts
        env:
          VITE_API_URL: ''
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          VITE_PUBLIC_POSTHOG_SESSION_RECORDING: ${{ vars.VITE_PUBLIC_POSTHOG_SESSION_RECORDING || 'false' }}
        run: |
          test -n "$VITE_PUBLIC_POSTHOG_KEY"
          pnpm build
          pnpm build:api
          test -f dist/index.html
          test -f server/dist/index.js
          test ! -d dist/uploads
          ! grep -R -F 'localhost:3001' dist server/dist

      - name: Package release
        run: |
          {
            find dist server/dist -type f -print0
            printf '%s\0' server/package.json server/package-lock.json
          } | sort -z | xargs -0 sha256sum > release.sha256
          tar -czf production-release.tar.gz \
            dist \
            server/dist \
            server/package.json \
            server/package-lock.json \
            release.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-${{ github.sha }}
          path: production-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://polarcraft.fun

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-${{ github.sha }}

      - name: Extract and verify release
        run: |
          mkdir release
          tar -xzf production-release.tar.gz -C release
          cd release
          sha256sum --check release.sha256
          test -f dist/index.html
          test -f server/dist/index.js
          test ! -d dist/uploads

      - name: Reject stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq --raw-output '.object.sha')
          test "$latest_sha" = "$EXPECTED_SHA"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/polarcraft_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/polarcraft_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/polarcraft_deploy >/dev/null

      - name: Stage and activate release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -Eeuo pipefail

          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]

          ssh_options=(
            -i "$HOME/.ssh/polarcraft_deploy"
            -p "$SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          remote="$SSH_USER@$SSH_HOST"

          ssh "${ssh_options[@]}" "$remote" \
            'set -eu; rm -rf /var/www/polarcraft/.deploy-staging/incoming; mkdir -p /var/www/polarcraft/.deploy-staging/incoming/server/dist'

          rsync -az --delete --no-owner --no-group --exclude='/uploads/' \
            -e "ssh -i $HOME/.ssh/polarcraft_deploy -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            release/dist/ "$remote:/var/www/polarcraft/.deploy-staging/incoming/dist/"

          rsync -az --delete --no-owner --no-group \
            -e "ssh -i $HOME/.ssh/polarcraft_deploy -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            release/server/dist/ "$remote:/var/www/polarcraft/.deploy-staging/incoming/server/dist/"

          rsync -az --no-owner --no-group \
            -e "ssh -i $HOME/.ssh/polarcraft_deploy -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            release/server/package.json \
            release/server/package-lock.json \
            release/release.sha256 \
            "$remote:/var/www/polarcraft/.deploy-staging/incoming/server/"

          ssh "${ssh_options[@]}" "$remote" '
            set -eu
            cd /var/www/polarcraft/.deploy-staging/incoming
            mv server/release.sha256 .
            sha256sum --check release.sha256
            test ! -d dist/uploads

            if ! cmp -s server/package.json /var/www/polarcraft/server/package.json \
              || ! cmp -s server/package-lock.json /var/www/polarcraft/server/package-lock.json; then
              cd server
              npm ci --omit=dev --no-audit --no-fund
            fi
          '

          latest_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq --raw-output '.object.sha')
          test "$latest_sha" = "$EXPECTED_SHA"

          ssh "${ssh_options[@]}" "$remote" \
            'sudo -n /usr/local/sbin/polarcraft-deploy'
